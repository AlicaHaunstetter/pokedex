<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/img/pokeball-white.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="templates.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <section class="header-logo">
        <img src="./assets/img/pokedex.png" alt="Pokedex Logo Font" />
      </section>
      <form class="search" onsubmit="startSearch(); return false;">
        <input
          type="text"
          id="search-input"
          data-id="search-input"
          aria-label="Search Pokemon by name"
          placeholder="At least 3 letters"
          oninput="checkInput()"
        />
        <button
          id="search-button"
          data-id="search-button"
          aria-label="Search Pokemon"
          disabled
        >
          Search
        </button>
      </form>
    </header>

    <dialog
      id="dialog"
      data-id="dialog"
      class="overlay"
      aria-label="Pokemon details"
      onclick="closeOnBackdrop(event)"
      onclose="unlockScroll()"
    ></dialog>

    <main id="content" data-id="content"></main>

    <section class="load-more-section">
      <div id="loading" class="loading-overlay" role="status" aria-label="Loading" hidden>
        <div class="spinner"></div>
        <span class="loading-text">Loading...</span>
      </div>
      <button
        id="load-more-button"
        data-id="load-more-button"
        aria-label="Load more Pokemon"
        onclick="loadPokemon()"
      >
        Load More
      </button>
    </section>
  </body>
</html>
