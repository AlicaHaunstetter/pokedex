<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/img/pokeball-white.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="templates.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <section class="header-logo">
        <img src="./assets/img/pokedex.png" alt="Pokedex Logo Font" />
      </section>
      <section class="search">
        <input type="text" id="search-input" />
      </section>
    </header>

    <dialog id="dialog" class="overlay"></dialog>

    <main id="content"></main>

    <section class="load-more-section">
      <p id="loading" hidden>Loading...</p>
      <button id="load-more-button" onclick="loadPokemon()">Load More</button>
    </section>
  </body>
</html>
